spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}

# Configuración de base de datos con soporte para MariaDB Cloud y fallback en memoria H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:dbgestor;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Spring Boot Actuator y Monitoreo Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
