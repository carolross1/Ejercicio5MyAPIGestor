spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}

# Configuración de base de datos con soporte para variables de entorno (Cloud / Render / Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/dbgestor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gestor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gestor123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Spring Boot Actuator y Monitoreo Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
