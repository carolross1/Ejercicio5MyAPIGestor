# Reglas de Alerta para Prometheus
# Circuito DevOps - GPDS Unidad III

groups:
  - name: devops_service_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Instancia {{ $labels.instance }} caída"
          description: "El servicio {{ $labels.job }} no responde a los chequeos de salud desde hace más de 30 segundos."

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[1m])) by (le)) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Alta latencia percentil 95 en {{ $labels.instance }}"
          description: "El 95% de las solicitudes superan los 500 ms de tiempo de respuesta."

      - alert: HighHttpErrorRate5xx
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) / sum(rate(http_server_requests_seconds_count[1m])) * 100 > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tasa de error HTTP 5xx superior al 2%"
          description: "El servicio experimenta un incremento anómalo de excepciones internas del servidor."
