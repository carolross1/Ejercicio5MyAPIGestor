version: "1"
services:
  - type: web
    name: api-gestor-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8081"
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mariadb://localhost:3306/dbgestor
      - key: SPRING_DATASOURCE_USERNAME
        value: gestor
      - key: SPRING_DATASOURCE_PASSWORD
        value: gestor123
